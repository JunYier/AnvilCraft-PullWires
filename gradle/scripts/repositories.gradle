repositories {
    mavenLocal()
    exclusiveContent {
        forRepositories(
                mavenCentral(),
                maven { // Anvil Lib
                    name = "Cjsah Maven"
                    url = "https://server.cjsah.net:1002/maven/releases/"
                    content {
                        includeGroup "dev.anvilcraft.lib"
                        includeGroup "dev.anvilcraft.resource"
                        includeGroup "dev.dubhe"
                    }
                }
        )
        filter {
            includeGroup "dev.anvilcraft.lib"
            includeGroup "dev.anvilcraft.resource"
            includeGroup "dev.dubhe"
        }
    }
    // 可选集成的编译期依赖。用 content 限定分组，避免影响其它依赖的解析顺序。
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
        content {
            includeGroup "mezz.jei"
            includeGroup "mezz.jei.api"
        }
    }
}
